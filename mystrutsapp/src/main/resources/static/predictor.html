<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Predictor Stock - Inventory App</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="sidebar">
  <h2>Inventory App</h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="stock.html">Current Stock</a>
    <a href="movements.html">Inventory Movement</a>
    <a href="predictor.html" class="active">Predictor Stock</a>
    <a href="user.html">Users</a>
    <a href="#" onclick="logout()">Log out</a>
  </nav>
</div>

<div class="content">
  <header>
    <h2>Predictor Stock</h2>
    <button class="btn-primary" onclick="showForm()">+ Add Sale</button>
  </header>

  <!-- Gráficos -->
  <section class="charts">
    <div class="chart-container">
      <h3>Historical Sales</h3>
      <canvas id="unitsSoldChart"></canvas>
    </div>
    <div class="chart-container">
      <h3>Predicted Sales Trend</h3>
      <canvas id="predictionChart"></canvas>
    </div>
  </section>

  <!-- Tabla de predicciones -->
  <section class="table-container">
    <h3>Prediction History</h3>
    <table id="predictorTable">
      <thead>
      <tr>
        <th>ID</th><th>Date</th><th>Product ID</th><th>Units Sold</th><th>Avg Price</th><th>Promo</th><th>Event</th><th>Actions</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Formulario emergente -->
  <div id="formContainer" class="form-popup hidden">
    <h3>Add Sale</h3>
    <form id="predictorForm">

      <div class="form-group">
        <label for="productId">Product ID</label>
        <select id="productId" required></select>
      </div>

      <div class="form-group">
        <label for="unitsSold">Units Sold</label>
        <input type="number" id="unitsSold" required />
      </div>

      <div class="form-group">
        <label for="avgSalePrice">Avg Price</label>
        <input type="number" step="0.01" id="avgSalePrice" value="29.99" readonly />
      </div>

      <div class="form-group">
        <label for="promotionActive">Promotion Active</label>
        <input type="checkbox" id="promotionActive" />
      </div>

      <div class="form-group">
        <label for="specialEvent">Special Event</label>
        <input type="text" id="specialEvent" />
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit">Save</button>
        <button class="btn-secondary" type="button" onclick="hideForm()">Cancel</button>
      </div>

    </form>
  </div>


<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/predictor.js"></script>
</body>
</html>
