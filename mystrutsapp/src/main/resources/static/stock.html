<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Current Stock - Inventory App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- Barra lateral -->
<aside class="sidebar">
  <h2>Inventory</h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="stock.html" class="active">Current Stock</a>
    <a href="movements.html">Inventory Movement</a>
    <a href="predictor.html">Predictor Stock</a>
    <a href="user.html">Users</a>
  </nav>
</aside>

<!-- Contenido principal -->
<main class="content">
  <header>
    <h2>Current Stock</h2>
    <button class="btn-primary" onclick="showForm()">+ Add Stock</button>
  </header>

  <!-- Tabla de stock -->
  <section class="table-container">
    <table id="stockTable">
      <thead>
      <tr>
        <th>ID</th><th>Product ID</th><th>Quantity</th><th>Last Updated</th><th>Total Cost</th><th>Actions</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Formulario emergente -->
  <div id="formContainer" class="form-popup hidden">
    <h3>Add Stock</h3>
    <form id="stockForm">
      <div class="form-group">
        <label for="productId">Product ID</label>
        <select id="productId" required></select>
      </div>

      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" placeholder="Quantity" required />
      </div>

      <div class="form-group">
        <label for="totalInventoryCost">Total Cost</label>
        <input type="number" id="totalInventoryCost" placeholder="Total Cost" required />
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit">Save</button>
        <button class="btn-secondary" type="button" onclick="hideForm()">Cancel</button>
      </div>
    </form>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <button class="btn-logout" onclick="logout()">Log out</button>
</footer>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/stock.js"></script>
</body>
</html>
