<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management - Inventory App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<aside class="sidebar">
  <h2>Inventory</h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="stock.html">Current Stock</a>
    <a href="movements.html">Inventory Movement</a>
    <a href="predictor.html">Predictor Stock</a>
    <a href="user.html" class="active">Users</a>
    <a href="#" onclick="logout()">Log out</a>
  </nav>
</aside>

<main class="content">
  <header>
    <h2>User Management</h2>
    <button class="btn-primary" onclick="showUserForm()">+ Add User</button>
  </header>

  <!-- Tabla de usuarios -->
  <section class="table-container">
    <h3>Users List</h3>
    <table id="usersTable">
      <thead>
      <tr>
        <th>ID</th><th>Username</th><th>Actions</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Formulario emergente -->
  <div id="userFormContainer" class="form-popup hidden">
    <h3>Add User</h3>
    <form id="userForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Username" required/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit">Save</button>
        <button class="btn-secondary" type="button" onclick="hideUserForm()">Cancel</button>
      </div>
    </form>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/user.js"></script>
</body>
</html>
