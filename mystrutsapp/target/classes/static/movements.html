<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory Movement - Inventory App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Inventory</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="stock.html">Current Stock</a>
    <a href="movements.html" class="active">Inventory Movement</a>
    <a href="predictor.html">Predictor Stock</a>
    <a href="#">Users</a>
    <a href="#" onclick="logout()">Log out</a>
  </div>
  <div class="content">
    <h2>Inventory Movements</h2>
    <button onclick="showForm()">+ Add Movement</button>
    <table id="movementTable">
      <thead>
        <tr>
          <th>ID</th><th>Date</th><th>Product ID</th><th>Type</th><th>Quantity</th><th>Order ID</th><th>Notes</th><th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="formContainer" class="form-popup hidden">
      <h3>Add Movement</h3>
      <form id="movementForm">
        <input type="text" id="movementId" placeholder="Movement ID" required />
        <input type="date" id="date" required />
        <input type="text" id="productId" placeholder="Product ID" required />
        <input type="text" id="movementType" placeholder="Type (INBOUND/OUTBOUND/...)" required />
        <input type="number" id="quantity" placeholder="Quantity" required />
        <input type="text" id="orderId" placeholder="Order ID" />
        <input type="text" id="notes" placeholder="Notes" />
        <button type="submit">Save</button>
        <button type="button" onclick="hideForm()">Cancel</button>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/movements.js"></script>
</body>
</html>
