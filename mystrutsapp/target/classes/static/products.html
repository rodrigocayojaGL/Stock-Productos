<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products - Inventory App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<!-- Barra lateral -->
<aside class="sidebar">
  <h2>Inventory</h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html" class="active">Products</a>
    <a href="stock.html">Current Stock</a>
    <a href="movements.html">Inventory Movement</a>
    <a href="predictor.html">Predictor Stock</a>
    <a href="user.html">Users</a>
  </nav>
</aside>

<!-- Contenido principal -->
<main class="content">
  <header>
    <h2>Product List</h2>
    <button class="btn-primary" onclick="showForm()">+ Add Product</button>
  </header>

  <!-- Tabla de productos -->
  <section class="table-container">
    <table id="productsTable">
      <thead>
      <tr>
        <th>Product ID</th><th>Name</th><th>SKU</th><th>Price</th><th>Category</th><th>Actions</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Formulario emergente -->
  <div id="formContainer" class="form-popup hidden">
    <h3 id="formTitle">Add Product</h3>
    <form id="productForm">
      <div class="form-group">
        <label for="productName">Name</label>
        <input type="text" id="productName" placeholder="Product Name" required />
      </div>

      <div class="form-group">
        <label for="price">Price</label>
        <input type="number" id="price" placeholder="Product Price" required />
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" placeholder="Product Category" required />
      </div>

      <div class="form-actions">
        <button class="btn-primary" type="submit">Save</button>
        <button class="btn-secondary" type="button" onclick="hideForm()">Cancel</button>
      </div>
    </form>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <button class="btn-logout" onclick="logout()">Log out</button>
</footer>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
</body>
</html>
