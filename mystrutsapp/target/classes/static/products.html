<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Products - Inventory App</title><link rel="stylesheet" href="css/style.css" /></head>
<body>
<div class="sidebar"><h2>Inventory</h2>
<a href="dashboard.html">Dashboard</a><a href="products.html" class="active">Products</a>
<a href="stock.html">Current Stock</a><a href="movements.html">Inventory Movement</a><a href="predictor.html">Predictor Stock</a><a href="#">Users</a>
<a href="#" onclick="logout()">Log out</a></div>
<div class="content">
  <h2>Product List</h2>
  <button onclick="showForm()">+ Add Product</button>
  <table id="productsTable"><thead>
  <tr><th>Product ID</th><th>Name</th><th>SKU</th><th>Price</th><th>Category</th><th>Actions</th></tr></thead><tbody></tbody></table>
  <div id="formContainer" class="form-popup hidden">
    <h3 id="formTitle">Add Product</h3>
    <form id="productForm">
      <input type="text" id="productId" placeholder="Product ID" required />
      <input type="text" id="productName" placeholder="Name" required />
      <input type="text" id="sku" placeholder="SKU" required />
      <input type="number" id="price" placeholder="Price" required />
      <input type="text" id="category" placeholder="Category" required />
      <button type="submit">Save</button><button type="button" onclick="hideForm()">Cancel</button>
    </form></div></div>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/products.js"></script>
</body></html>
