<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Current Stock - Inventory App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sidebar">
    <h2>Inventory</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="stock.html" class="active">Current Stock</a>
    <a href="movements.html">Inventory Movement</a>
    <a href="movements.html">Predictor Stock</a>
    <a href="#">Users</a>
    <a href="#" onclick="logout()">Log out</a>
  </div>
  <div class="content">
    <h2>Current Stock</h2>
    <button onclick="showForm()">+ Add Stock</button>
    <table id="stockTable">
      <thead>
        <tr>
          <th>ID</th><th>Product ID</th><th>Quantity</th><th>Last Updated</th><th>Total Cost</th><th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="formContainer" class="form-popup hidden">
      <h3>Add Stock</h3>
      <form id="stockForm">
        <input type="number" id="id" placeholder="ID" required />
        <input type="text" id="productId" placeholder="Product ID" required />
        <input type="number" id="quantity" placeholder="Quantity" required />
        <input type="datetime-local" id="lastUpdated" required />
        <input type="number" id="totalInventoryCost" placeholder="Total Cost" required />
        <button type="submit">Save</button>
        <button type="button" onclick="hideForm()">Cancel</button>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/stock.js"></script>
</body>
</html>
