<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predictor Stock - Inventory App</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Barra lateral -->
<aside class="sidebar">
  <h2>Inventory App</h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="stock.html">Current Stock</a>
    <a href="movements.html">Inventory Movement</a>
    <a href="predictor.html" class="active">Predictor Stock</a>
    <a href="user.html">Users</a>
    <a href="#" onclick="logout()">Log out</a>
  </nav>
</aside>

<!-- Contenido principal -->
<main class="content">
  <header>
    <h2>Predictor Stock</h2>
    <button class="btn-primary" onclick="showForm()">+ Add Sale</button>
  </header>

  <!-- Gráficos -->
  <section class="charts">
    <div class="chart-container">
      <h3>Historical Sales</h3>
      <canvas id="unitsSoldChart"></canvas>
    </div>
    <div class="chart-container">
      <h3>Predicted Sales Trend</h3>
      <canvas id="predictionChart"></canvas>
    </div>
  </section>

  <!-- Tabla de predicciones -->
  <section class="table-container">
    <h3>Prediction History</h3>
    <table id="predictorTable">
      <thead>
      <tr>
        <th>ID</th><th>Date</th><th>Product ID</th><th>Units Sold</th><th>Avg Price</th><th>Promo</th><th>Event</th><th>Actions</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Formulario emergente -->
  <div id="formContainer" class="form-popup hidden">
    <h3>Add Sale</h3>
    <form id="predictorForm">
      <label>ID</label>
      <input type="number" id="id" required />

      <label>Date</label>
      <input type="datetime-local" id="date" required />

      <label>Product ID</label>
      <input type="text" id="productId" required />

      <label>Units Sold</label>
      <input type="number" id="unitsSold" required />

      <label>Avg Price</label>
      <input type="number" step="0.01" id="avgSalePrice" required />

      <label>
        <input type="checkbox" id="promotionActive" /> Promotion Active
      </label>

      <label>Special Event</label>
      <input type="text" id="specialEvent" />

      <button class="btn-primary" type="submit">Save</button>
      <button class="btn-secondary" type="button" onclick="hideForm()">Cancel</button>
    </form>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/predictor.js"></script>
</body>
</html>
